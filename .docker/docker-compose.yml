services:
  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-db
    command: --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - coworking-db-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [wpnet]

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - coworking-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [wpnet]

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wp
    container_name: ${PROJECT_NAME}-wp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      APACHE_DOCUMENT_ROOT: /var/www/html
    volumes:
      - ../:/var/www/html
    ports:
      - "${HOST_HTTP_PORT}:80"
    networks: [wpnet]


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PROJECT_NAME}-pma
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks: [wpnet]
  seed:
    image: mysql:8.0-debian
    container_name: ${PROJECT_NAME}-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: db
      MYSQL_DUMP_URL: ${MYSQL_DUMP_URL}
      WP_SITEURL: ${WP_SITEURL}
      WP_TABLE_PREFIX: ${WP_TABLE_PREFIX}
    entrypoint: ["/bin/bash","-lc"]
    command: >
      "apt-get update -qq &&
      apt-get install -y curl gzip tar unzip &&
      echo 'Importing dump from ${MYSQL_DUMP_URL}...' &&
      case \"${MYSQL_DUMP_URL}\" in
        *.tar.gz) curl -fsSL ${MYSQL_DUMP_URL} | tar -xzO | mysql -h $$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE ;;
        *.sql.gz) curl -fsSL ${MYSQL_DUMP_URL} | gunzip    | mysql -h $$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE ;;
        *.zip)    
          TMPFILE=$$(mktemp) && \
          curl -fsSL ${MYSQL_DUMP_URL} -o $$TMPFILE && \
          unzip -p $$TMPFILE | mysql -h $$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE && \
          rm -f $$TMPFILE ;;
        *.sql)    curl -fsSL ${MYSQL_DUMP_URL}             | mysql -h $$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE ;;
        *) echo 'Unsupported dump format' && exit 1 ;;
      esac &&
      echo 'Updating WordPress siteurl & home...' &&
      mysql -h $$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e \"
        UPDATE \\\`${WP_TABLE_PREFIX}options\\\` SET option_value='$$WP_SITEURL'    WHERE option_name='home';
        UPDATE \\\`${WP_TABLE_PREFIX}options\\\` SET option_value='$$WP_SITEURL' WHERE option_name='siteurl';
      \""
    networks: [wpnet]

  
volumes:
  coworking-db-data:
  coworking-redis-data:

networks:
  wpnet:
